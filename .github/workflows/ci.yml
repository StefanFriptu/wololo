name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  BUN_VERSION: 1.4.4
  TSMUXER_URL: https://github.com/justdan96/tsMuxer/releases/download/2.7.0/tsMuxer-2.7.0-linux.zip
  TSMUXER_SHA256: ceaaa181ab70e201685b1e45260d337d1cbdb0aba1408d4fbc47e232a7e4c987

jobs:
  commits:
    name: commit hygiene
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse fixup, squash and amend commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pending="$(git log --format=%s "${BASE_SHA}..${HEAD_SHA}" | grep -E '^(fixup|squash|amend)!' || true)"
          if [ -n "${pending}" ]; then
            echo "::error::Fold these commits with an autosquash rebase before merging:"
            echo "${pending}"
            exit 1
          fi

  check:
    name: lint, typecheck, tests
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun run lint
      - run: bun run typecheck
      - name: Install media tools (ffmpeg, MKVToolNix, 7-Zip, tsMuxeR)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg mkvtoolnix 7zip unzip
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/tsmuxer.zip" "${TSMUXER_URL}"
          echo "${TSMUXER_SHA256}  ${RUNNER_TEMP}/tsmuxer.zip" | sha256sum -c -
          sudo unzip -o -j "${RUNNER_TEMP}/tsmuxer.zip" tsMuxeR -d /usr/local/bin
          sudo chmod 0755 /usr/local/bin/tsMuxeR
          ffmpeg -hide_banner -version
          mkvmerge --version
          7z i > /dev/null
          command -v tsMuxeR
      - name: Cache media fixtures
        uses: actions/cache@v4
        with:
          path: test/.cache/fixtures
          key: fixtures-${{ runner.os }}-${{ hashFiles('test/helpers/fixtures.ts', 'test/helpers/generate-fixtures.ts') }}
      - name: Generate fixtures
        run: bun run fixtures
      - name: Build web (the URL-base test needs web/build)
        working-directory: web
        run: bun run build
      - name: Tests (the BDMV end-to-end and real web build tests must run, not skip)
        run: bun test
        env:
          WOLOLO_REQUIRE_BDMV_E2E: "1"
          WOLOLO_REQUIRE_WEB_BUILD: "1"

  web:
    name: web check and build
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: svelte-check
        working-directory: web
        run: bun run check
      - name: Build
        working-directory: web
        run: bun run build

  image:
    name: image (${{ matrix.arch }})
    needs: [check, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wololo" >> "${GITHUB_ENV}"
      - name: Build version (X.Y.Z on v* tags, <branch>-<sha> or pr-<n>-<sha> otherwise)
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "${REF_TYPE}" = tag ]; then
            version="${REF_NAME#v}"
          elif [ -n "${PR_NUMBER}" ]; then
            version="pr-${PR_NUMBER}-${SHA::7}"
          else
            version="${REF_NAME//\//-}-${SHA::7}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - uses: docker/setup-buildx-action@v3
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          labels: org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - name: Build for the smoke test (native ${{ matrix.arch }}, no emulation)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          provenance: false
          tags: wololo:smoke
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}
      - name: Smoke test
        run: docker/smoke-test.sh wololo:smoke
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push by digest
        if: github.event_name == 'push'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.arch }}
      - name: Export digest
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - name: Upload digest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: publish multi-arch image
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wololo" >> "${GITHUB_ENV}"
      - uses: docker/setup-buildx-action@v3
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          labels: org.opencontainers.image.version=${{ needs.image.outputs.version }}
          annotations: org.opencontainers.image.version=${{ needs.image.outputs.version }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push the manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          args=()
          while IFS= read -r tag; do args+=(--tag "${tag}"); done < <(jq -r '.tags[]' <<< "${DOCKER_METADATA_OUTPUT_JSON}")
          while IFS= read -r annotation; do args+=(--annotation "${annotation}"); done < <(jq -r '.annotations[]' <<< "${DOCKER_METADATA_OUTPUT_JSON}")
          sources=()
          for digest in *; do sources+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
      - name: Inspect
        env:
          TAG: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: docker buildx imagetools inspect "${TAG}"
