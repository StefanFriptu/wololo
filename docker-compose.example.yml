services:
  wololo:
    # ":main" follows the main branch; switch to ":latest" (newest release) once a v* release exists.
    image: ghcr.io/OWNER/wololo:main
    container_name: wololo
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - UMASK=002
    volumes:
      - ./wololo/config:/config
      # Mount media at the same path Radarr/Sonarr use so renames stay atomic.
      - /path/to/data:/data
    ports:
      - 8585:8585
    restart: unless-stopped
    # Lets a running ffmpeg/mkvmerge job stop cleanly (Docker's default is 10 s).
    stop_grace_period: 30s
