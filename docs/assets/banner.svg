<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="t d">
  <title id="t">Wololo</title>
  <desc id="d">DTS, TrueHD, E-AC3 and PCM audio tracks flow through a conversion swirl and come out as AC3 on a TV that direct-plays.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1040"/>
      <stop offset="0.55" stop-color="#2a1660"/>
      <stop offset="1" stop-color="#0d3b4f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" gradientUnits="userSpaceOnUse" x1="730" y1="0" x2="860" y2="0">
      <stop offset="0" stop-color="#ff8a5c"/>
      <stop offset="0.5" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#5ee6c8"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14304a"/>
      <stop offset="1" stop-color="#0a1a2a"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1280" height="440" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="440" rx="28" fill="url(#dots)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700" font-size="22" text-anchor="middle">
    <g transform="translate(150 118) rotate(-6)">
      <rect x="-62" y="-24" width="124" height="48" rx="24" fill="#ff8a5c" fill-opacity="0.18" stroke="#ff8a5c" stroke-width="2"/>
      <text y="8" fill="#ffb592">DTS</text>
    </g>
    <g transform="translate(228 186) rotate(4)">
      <rect x="-74" y="-24" width="148" height="48" rx="24" fill="#ff6b8b" fill-opacity="0.18" stroke="#ff6b8b" stroke-width="2"/>
      <text y="8" fill="#ffa3b7">TrueHD</text>
    </g>
    <g transform="translate(140 254) rotate(-3)">
      <rect x="-68" y="-24" width="136" height="48" rx="24" fill="#c58bff" fill-opacity="0.18" stroke="#c58bff" stroke-width="2"/>
      <text y="8" fill="#dcb8ff">E-AC3</text>
    </g>
    <g transform="translate(222 322) rotate(5)">
      <rect x="-58" y="-24" width="116" height="48" rx="24" fill="#ffb84d" fill-opacity="0.18" stroke="#ffb84d" stroke-width="2"/>
      <text y="8" fill="#ffd291">PCM</text>
    </g>
  </g>

  <g fill="none" stroke-linecap="round" stroke-width="3" stroke-opacity="0.75">
    <path d="M218 118 C 380 130, 460 190, 560 214" stroke="#ff8a5c"/>
    <path d="M310 186 C 410 190, 470 205, 560 216" stroke="#ff6b8b"/>
    <path d="M216 254 C 360 250, 450 232, 560 220" stroke="#c58bff"/>
    <path d="M286 322 C 400 300, 470 245, 560 224" stroke="#ffb84d"/>
  </g>

  <circle cx="640" cy="220" r="150" fill="url(#glow)"/>
  <g transform="translate(640 220)" fill="none" stroke-linecap="round">
    <path d="M0 -84 A84 84 0 0 1 84 0" stroke="#ffd27a" stroke-width="6"/>
    <path d="M0 84 A84 84 0 0 1 -84 0" stroke="#ffd27a" stroke-width="6"/>
    <path d="M44 -44 A62 62 0 0 1 44 44" stroke="#ff8a5c" stroke-width="5" transform="rotate(30)"/>
    <path d="M-44 44 A62 62 0 0 1 -44 -44" stroke="#ff8a5c" stroke-width="5" transform="rotate(30)"/>
    <path d="M0 -40 A40 40 0 0 1 40 0" stroke="#5ee6c8" stroke-width="5" transform="rotate(75)"/>
    <path d="M0 40 A40 40 0 0 1 -40 0" stroke="#5ee6c8" stroke-width="5" transform="rotate(75)"/>
    <circle r="14" fill="#fff4d6"/>
  </g>

  <path d="M730 220 L 860 220" stroke="url(#beam)" stroke-width="6" stroke-linecap="round"/>
  <path d="M850 206 L 870 220 L 850 234" fill="none" stroke="#5ee6c8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(1040 214)">
    <rect x="-150" y="-104" width="300" height="190" rx="18" fill="#0b1524" stroke="#5ee6c8" stroke-width="4"/>
    <rect x="-134" y="-88" width="268" height="158" rx="10" fill="url(#screen)"/>
    <path d="M-22 -40 L 34 -9 L -22 22 Z" fill="#5ee6c8"/>
    <g transform="translate(0 46)" fill="#5ee6c8">
      <rect x="-64" y="-6" width="8" height="12" rx="2" fill-opacity="0.6"/>
      <rect x="-48" y="-12" width="8" height="24" rx="2" fill-opacity="0.75"/>
      <rect x="-32" y="-8" width="8" height="16" rx="2" fill-opacity="0.6"/>
      <rect x="24" y="-10" width="8" height="20" rx="2" fill-opacity="0.6"/>
      <rect x="40" y="-14" width="8" height="28" rx="2" fill-opacity="0.75"/>
      <rect x="56" y="-6" width="8" height="12" rx="2" fill-opacity="0.6"/>
    </g>
    <path d="M-40 86 L -56 118 M40 86 L 56 118" stroke="#5ee6c8" stroke-width="5" stroke-linecap="round"/>
    <g transform="translate(108 -104)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="800" text-anchor="middle">
      <rect x="-56" y="-22" width="112" height="44" rx="22" fill="#5ee6c8"/>
      <text y="8" font-size="22" fill="#0b1524">AC3 5.1</text>
    </g>
  </g>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="640" y="398" font-size="40" font-weight="800" letter-spacing="10" fill="#fff4d6">WOLOLO</text>
  </g>
</svg>
